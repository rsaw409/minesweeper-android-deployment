name: Build & Publish Android Release

on:
  workflow_dispatch:

# The Play Store versionCode must strictly increase on every upload. 4 is the
# versionCode of the last release published via PWABuilder, so runs count up from it.
#
# BUBBLEWRAP_VERSION is pinned deliberately: this is the only thing standing between a
# routine release and an unreviewed Android target SDK bump, since `bubblewrap update`
# regenerates the whole Android project (and picks whatever SDK versions that Bubblewrap
# release bundles) from twa-manifest.json on every run. Bump this by hand, in its own PR,
# when you need a new target SDK / Play policy compliance version — see README.md.
env:
  VERSION_CODE_BASE: 4
  BUBBLEWRAP_VERSION: 1.25.0

jobs:
  build:
    name: Build & Sign TWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must run before "Set up JDK 17" below: that step's `cache: gradle` hashes
      # **/*.gradle*, gradle-wrapper.properties etc. to key its cache, and none of
      # those files exist in the checkout until this generates them from
      # twa-manifest.json. bubblewrap update needs neither JDK nor the Android SDK.
      - name: Generate Android project from twa-manifest.json
        run: npx --yes @bubblewrap/cli@${{ env.BUBBLEWRAP_VERSION }} update --skipVersionUpgrade

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3's default packages input is "tools platform-tools", but Google has since
          # removed the legacy "tools" package from the SDK repository entirely, which
          # makes sdkmanager exit non-zero. Override to skip it.
          packages: "platform-tools"

      - name: Configure Bubblewrap CLI
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: Work around bubblewrap's legacy sdkmanager lookup
        run: |
          # bubblewrap looks for $ANDROID_HOME/tools/bin/sdkmanager first, which no longer
          # ships in modern SDK installs (and the old jar is incompatible with JDK 17+ anyway).
          # Point it at the modern cmdline-tools sdkmanager instead.
          modern_sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          if [ -z "$modern_sdkmanager" ]; then
            echo "::error::Could not locate a modern sdkmanager under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME/cmdline-tools" 2>&1
            exit 1
          fi
          echo "Using sdkmanager at: $modern_sdkmanager"
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$modern_sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"

      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.0.3
        with:
          fileName: upload-keystore.jks
          encodedString: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Set version code from run number
        run: |
          version_code=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode ${version_code}/" app/build.gradle
          echo "Building versionCode ${version_code}"

      - name: Build signed Android App Bundle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx --yes @bubblewrap/cli@${{ env.BUBBLEWRAP_VERSION }} build \
            --signingKeyPath="${{ steps.android_keystore.outputs.filePath }}" \
            --signingKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}"

      - name: Upload Android Release
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app-release-bundle.aab

  deploy:
    name: Publish to Play Store
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Get Android Build from artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release

      - name: Release Build to production track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_ACCOUNT_KEY }}
          packageName: developer.rohitsaw.minesweeper
          releaseFiles: app-release-bundle.aab
          track: production
          status: completed
